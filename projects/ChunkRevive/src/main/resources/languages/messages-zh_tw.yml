tuning:
    title: ChunkRevive 自動調校
    hardware-title: 硬體與執行環境
    regen-title: 區塊再生調校
    scan-title: 磁碟掃描調校
    preview-title: <mode> 模式預覽
    info-line: <#7A7A7A><label>：<#FBFF8B><value>
    setting-line: <#7A7A7A><label>：<#0094D5><current> <#7A7A7A>→ <#FBFF8B><recommended>
    recommended-mode-line: <#7A7A7A>系統建議：<#8BFF7B><mode>
    label-processors: 邏輯處理器
    label-heap: JVM Heap
    label-system-memory: 系統可見記憶體
    label-jvm-threads: JVM 執行緒
    label-cpu-load: 系統 CPU 使用率
    label-environment: 伺服器執行環境
    hover-processors: |-
        <#0094D5>邏輯處理器</#0094D5>
        <#7A7A7A>JVM 可使用的處理器數量；容器 CPU 限制通常也會反映在此。
        此值是再生與掃描執行緒上限的主要依據。
    hover-heap: |-
        <#0094D5>JVM Heap</#0094D5>
        <#7A7A7A>由 -Xmx 限制的 Java 記憶體。
        較大的 Heap 可容納更多同時生成的區塊，但不代表應使用全部記憶體。
    hover-system-memory: |-
        <#0094D5>系統可見記憶體</#0094D5>
        <#7A7A7A>JVM 或容器目前可見的實體記憶體。
        調校以 JVM Heap 為硬限制；系統可用記憶體過低時會建議最佳化模式。
    hover-jvm-threads: |-
        <#0094D5>JVM 執行緒</#0094D5>
        <#7A7A7A>整個伺服器目前存活的 Java 執行緒。
        它會隨插件與工作量變動，因此不直接寫入數值公式；異常偏高時會建議最佳化模式。
    hover-cpu-load: |-
        <#0094D5>系統 CPU 使用率</#0094D5>
        <#7A7A7A>執行指令當下的系統負載快照。
        高負載時會建議最佳化模式，但不改變各模式的固定計算結果。
    hover-environment: |-
        <#0094D5>伺服器執行環境</#0094D5>
        <#7A7A7A>Paper 使用主執行緒；Folia 將世界工作分配到 region threads。
        套用批次過大時，兩者都可能出現 tick 延遲。
    mode-optimized: 最佳化
    mode-balanced: 平衡
    mode-performance: 性能
    hover-mode-optimized: |-
        <#8BFF7B>最佳化模式</#8BFF7B>
        <#7A7A7A>優先維持 TPS 與 Folia region tick 穩定。
        較低 CPU、磁碟 I/O 與記憶體峰值，但完成時間較長。
        <#FBFF8B>點擊查看完整配置差異
    hover-mode-balanced: |-
        <#FBFF8B>平衡模式</#FBFF8B>
        <#7A7A7A>在伺服器穩定與處理速度間取得平衡，適合一般正式伺服器。
        <#FBFF8B>點擊查看完整配置差異
    hover-mode-performance: |-
        <#FF6048>性能模式</#FF6048>
        <#7A7A7A>使用更多 CPU、磁碟 I/O 與記憶體來縮短處理時間。
        建議只在維護時段使用；記憶體安全限制仍會保持啟用。
        <#FBFF8B>點擊查看完整配置差異
    label-generation-threads: 地形產生執行緒
    label-generation-priority: 地形執行緒優先級
    label-batch-delay: 批次間隔 ticks
    label-batch-concurrency: 再生批次併發
    label-batch-size: 每批區塊上限
    label-work-tile-size: 空間工作 Tile 上限
    label-apply-batch-size: 每 tick 套用批次
    label-memory-safety: 記憶體安全
    label-active-batches: 記憶體安全活躍批次
    label-memory-batch-size: 記憶體安全批次上限
    label-generation-limit: 記憶體安全執行緒上限
    label-heap-watermark: Heap 高水位
    label-scan-threads: 掃描執行緒
    label-scan-priority: 掃描執行緒優先級
    hover-generation-threads: |-
        <#0094D5>配置：regen.thread-pool.parallelism</#0094D5>
        <#7A7A7A>調高可加快地形計算，但會增加 CPU 與短期記憶體使用，並可能影響 tick。
        調低可減輕處理器壓力，但再生耗時更長。
        本次依 <processors> 個處理器與 <heap> MiB Heap 建議 <recommended>。
    hover-generation-priority: |-
        <#0094D5>配置：regen.thread-pool.priority</#0094D5>
        <#7A7A7A>調高會讓地形工作更積極競爭 CPU；調低可讓伺服器 tick 與其他插件優先執行。
        Java 正常優先級為 5。
    hover-batch-delay: |-
        <#0094D5>配置：regen.batch-delay-ticks</#0094D5>
        <#7A7A7A>調高可分散負載並改善 tick 穩定性，但會延長總時間。
        調低會更快派發工作，也會增加持續 CPU 與 I/O 壓力。
    hover-batch-concurrency: |-
        <#0094D5>配置：regen.batch-concurrency</#0094D5>
        <#7A7A7A>目前每張地形 DAG 已使用共享生成池。多批次同時執行會競爭相同 workers、重複 halo 並降低 CARVERS 快取命中率，因此自動調校固定為 1。
    hover-batch-size: |-
        <#0094D5>配置：regen.max-chunks-per-batch</#0094D5>
        <#7A7A7A>0 代表不切割相鄰生成批次，可保持樹木、樹葉、礦脈等跨區塊裝飾連續。
        代價是大型連續範圍會占用更多記憶體，且完成前不會提交部分進度。
    hover-work-tile-size: |-
        <#0094D5>配置：regen.work-tile-size</#0094D5>
        <#7A7A7A>限制每張空間生成 DAG 的目標區塊數。依 Heap 調高可減少 tile halo 重複，調低則減少 ProtoChunk 與 CARVERS 快取的記憶體峰值。
        本次依 <heap> MiB Heap 建議 <recommended>。
    hover-apply-batch-size: |-
        <#0094D5>配置：regen.apply-batch-size</#0094D5>
        <#7A7A7A>控制每 tick 可套用的區塊數。調高可更快完成載入、光照與鄰居更新，但更容易造成 tick 尖峰。
    hover-memory-safety: |-
        <#0094D5>配置：regen.memory-safety.enabled</#0094D5>
        <#7A7A7A>啟用 Heap 水位、批次數、批次大小與產生執行緒硬限制。所有自動模式都會保持啟用，以降低 OOM 與伺服器崩潰風險。
    hover-active-batches: |-
        <#0094D5>配置：regen.memory-safety.max-active-batches</#0094D5>
        <#7A7A7A>AUTO 使用 Heap 自動上限；CONFIG／IGNORE 不增加第二層上限，直接依 regen.batch-concurrency；正整數則是固定硬上限。
    hover-memory-batch-size: |-
        <#0094D5>配置：regen.memory-safety.max-chunks-per-batch</#0094D5>
        <#7A7A7A>AUTO 依 Heap 切割；CONFIG／IGNORE 按照 regen.max-chunks-per-batch。
        調校模式使用 CONFIG，讓上層的 0 保持無限制，避免跨區塊裝飾斷層。
    hover-generation-limit: |-
        <#0094D5>配置：regen.memory-safety.max-generation-threads</#0094D5>
        <#7A7A7A>AUTO 使用 Heap／CPU 自動上限；CONFIG／IGNORE 直接依 regen.thread-pool.parallelism；正整數則是固定硬上限。
    hover-heap-watermark: |-
        <#0094D5>配置：regen.memory-safety.heap-high-watermark-percent</#0094D5>
        <#7A7A7A>Heap 使用量到達此比例時暫停派發新批次。調高可提高吞吐量，但更接近 OOM；調低則更保守。
    hover-scan-threads: |-
        <#0094D5>配置：scan.thread-pool.parallelism</#0094D5>
        <#7A7A7A>並行讀取 region 檔案的工作數。調高可加快掃描，但會增加 CPU 與磁碟隨機讀取；HDD 或共享儲存可能因此變慢。
    hover-scan-priority: |-
        <#0094D5>配置：scan.thread-pool.priority</#0094D5>
        <#7A7A7A>調高讓掃描更積極競爭 CPU；調低可減少它對伺服器 tick、再生及其他插件的影響。
